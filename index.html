span class="tiny">Χωρίς επιλογή εμφανίζονται μόνο ημέρες με γεγονότα των ενεργών φίλτρων.</span></div><div id="loadStatus" class="inlinehelp" role="status">Φόρτωση προγράμματος…</div><div id="localLoad" class="row hidden"><label>Δοκιμή τοπικά: <input type="file" id="publicFile" accept=".json,application/json"></label></div><div id="calendarBody"></div></div></section></main><div id="modalHost"></div><script>(()=>{'use strict';const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const categories={reg:'Ημερίδες ΟΜΗ',special:'Διοργανώσεις ΟΜΗ',lesson:'Μαθήματα',external:'ΕΟΜ & άλλοι όμιλοι',other:'Άλλες εκδηλώσεις',holiday:'Αργίες'};const addDays=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};const weekday=s=>new Date(s+'T12:00:00Z').getUTCDay();const fmt=(s,opt={})=>new Intl.DateTimeFormat('el-GR',{timeZone:'UTC',...opt}).format(new Date(s+'T12:00:00Z'));const dateGR=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4):s||'';const dateLabel=s=>fmt(s,{weekday:'long'})+' '+dateGR(s);const validTime=s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s);const todayISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};let events=[],view='summary',cursor=todayISO(),filter=new Set(Object.keys(categories)),savedNonYearFilters=null,search='';function filtered(){return events.filter(e=>filter.has(e.category)&&(`${e.title} ${categories[e.category]}`).toLocaleLowerCase('el').includes(search.toLocaleLowerCase('el')))}function detail(e){let bits=[];if(e.category==='reg')bits.push(e.independent?'Ανεξάρτητη ημερίδα':`${e.number}η / ${e.groupTotal} · ${e.group}ο πολυήμερο`);if(e.simultaneous)bits.push('Ταυτόχρονο');if(e.category==='special')bits.push(`${e.number}/${e.total} ημερίδα`,e.grade?`${e.grade} βαθμίδα`:'');if(e.category==='lesson')bits.push(`${e.cycleNumber}ο μάθημα · ${e.cycle}ος κύκλος`);return bits.filter(Boolean).join(' · ')}function periodRange(){const year=+cursor.slice(0,4),month=+cursor.slice(5,7);if(view==='summary'||view==='year')return [year+'-01-01',year+'-12-31'];if(view==='month')return [cursor.slice(0,7)+'-01',year+'-'+String(month).padStart(2,'0')+'-'+String(monthLast(year,month)).padStart(2,'0')];if(view==='week'){const offset=(weekday(cursor)+6)%7;const start=addDays(cursor,-offset);return[start,addDays(start,6)]}return[cursor.slice(0,7)+'-01',year+'-'+String(month).padStart(2,'0')+'-'+String(monthLast(year,month)).padStart(2,'0')]}function monthLast(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}let loaded=false, groups=[];const important=e=>e.category==='special'||e.category==='external';
function groupEvents(list){const result=[],last=new Map();for(const e of list.filter(important)){const key=JSON.stringify([e.category,e.title,e.grade||'',e.total||0]);let g=last.get(key);const join=g&&(e.category==='special'?(e.number>1&&e.number===g.items.at(-1).number+1):e.date===addDays(g.items.at(-1).date,1));if(!join){g={items:[],category:e.category,title:e.title};result.push(g);last.set(key,g)}g.items.push(e)}return result.map((g,i)=>({...g,index:i,start:g.items[0].date,end:g.items.at(-1).date}));}
function groupDates(g){const ds=[...new Set(g.items.map(e=>e.date))];if(ds.length===1)return dateGR(ds[0]);if(ds.every((d,i)=>!i||d===addDays(ds[i-1],1)))return dateGR(ds[0])+' – '+dateGR(ds.at(-1));return ds.map(dateGR).join(', ')}
function showGroup(i){const g=groups[i];if(!g)return;$('modalHost').innerHTML=`<div class="modalback" id="modalBack"><div class="modal"><h2>${esc(g.title)}</h2><p>${esc(categories[g.category])}</p>${g.items.map(e=>`<button class="day-detail ${e.category==='reg'&&e.independent?'independent-reg':''}" data-show="${esc(e.id)}"><strong>${esc(dateLabel(e.date))} · ${esc(e.time||'Χωρίς ώρα')}</strong><span>${esc(detail(e))}</span></button>`).join('')}<button class="btn" id="closeGroup">Κλείσιμο</button></div></div>`;$('closeGroup').onclick=closeModal}
function renderHighlights(){const t=todayISO();if(!loaded){$('highlights').textContent='Αναμονή προγράμματος…';return}const today=events.filter(e=>e.date===t),next=groups.filter(g=>g.end>=t).sort((a,b)=>a.items.find(e=>e.date>=t).date.localeCompare(b.items.find(e=>e.date>=t).date))[0];$('highlights').innerHTML=`<div><h3>Σήμερα, ${esc(fmt(t,{weekday:'long',day:'numeric',month:'long'}))}</h3>${today.length?today.map(e=>`<button class="highlight-event ${e.category} ${e.category==='reg'&&e.independent?'independent-reg':''}" data-show="${esc(e.id)}">${esc(e.time?e.time+' · ':'')}${esc(e.title)}${e.category==='reg'&&e.independent?' (Αν)':''}</button>`).join(''):'Δεν υπάρχουν γεγονότα σήμερα.'}</div><div><h3>Επόμενη διοργάνωση</h3>${next?`<button class="highlight-event ${next.category}" data-group="${next.index}"><strong>${esc(next.title)}</strong><br>${esc(groupDates(next))}${next.start<t?' · Σε εξέλιξη':''}</button>`:'Δεν υπάρχει επόμενη δημοσιευμένη διοργάνωση.'}</div>`}

function icsEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}

$('exportICS').onclick=()=>{if(!loaded){alert('Φορτώστε πρώτα το πρόγραμμα.');return}const list=events.filter(e=>filter.has(e.category)&&($('showPast').checked||e.date>=todayISO()));if(!list.length){alert('Δεν υπάρχουν γεγονότα στις επιλεγμένες κατηγορίες.');return}const url=URL.createObjectURL(new Blob([buildICS(list)],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='OMH_calendar.ics';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)};
function validate(p){const date=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d;const allowed=['id','date','time','title','category','number','group','groupTotal','total','cycle','cycleNumber','independent','simultaneous','grade'];if(!p||p.format!=='omh-calendar-public'||p.version!==1||!date(p.cutoff)||!Array.isArray(p.events)||Object.keys(p).some(k=>!['format','version','cutoff','events','publishedAt'].includes(k)))throw Error('Μη έγκυρο δημόσιο αρχείο');const ids=new Set();for(const e of p.events){if(!e||Object.keys(e).some(k=>!allowed.includes(k))||typeof e.id!=='string'||ids.has(e.id)||!date(e.date)||e.date>p.cutoff||typeof e.title!=='string'||!Object.hasOwn(categories,e.category)||typeof e.time!=='string'||(e.time&&!validTime(e.time)))throw Error('Μη έγκυρη εγγραφή');for(const k of ['number','group','groupTotal','total','cycle','cycleNumber'])if(k in e&&(!Number.isInteger(e[k])||e[k]<1))throw Error('Μη έγκυρη αρίθμηση');for(const k of ['independent','simultaneous'])if(k in e&&typeof e[k]!=='boolean')throw Error('Μη έγκυρη ένδειξη');if('grade' in e&&!['1η','2η','3η','4η'].includes(e.grade))throw Error('Μη έγκυρη βαθμίδα');ids.add(e.id)}return p}function load(p){validate(p);events=p.events.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'99').localeCompare(b.time||'99')||a.title.localeCompare(b.title,'el'));groups=groupEvents(events);loaded=true;$('loadStatus').textContent=(location.protocol==='file:'?'Τοπική δοκιμή · ':'')+'Πρόγραμμα έως '+dateGR(p.cutoff);renderPublic()}function fail(){events=[];groups=[];loaded=false;$('loadStatus').textContent='Δεν ήταν δυνατή η φόρτωση του δημόσιου προγράμματος.';renderPublic()}renderPublic();if(location.protocol==='file:'){$('localLoad').classList.remove('hidden');$('loadStatus').textContent='Επιλέξτε το δημόσιο calendar.json για τοπική δοκιμή.';$('publicFile').onchange=async e=>{try{if(!e.target.files[0])return;$('loadStatus').textC
